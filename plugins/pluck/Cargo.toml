[package]
name = "mangue-pluck"
description = "An example CLAP instrument built with Manguebyte: a polyphonic plucked synth."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
## Builds the example that plays the plugin on the sound card.
standalone = ["manguebyte/standalone"]

[[example]]
name = "play"
required-features = ["standalone"]

[dependencies]
manguebyte = { path = "../../crates/manguebyte", default-features = false, features = ["clap"] }

[lints]
workspace = true
