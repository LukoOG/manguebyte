[package]
name = "manguebyte-devices"
description = "Audio device input and output for the Manguebyte audio framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["midi"]
## MIDI input and output ports.
midi = ["dep:midir", "dep:manguebyte-midi"]

[dependencies]
manguebyte-core.workspace = true
manguebyte-midi = { workspace = true, optional = true }
cpal = "0.18"
midir = { version = "0.11", optional = true }

[lints]
workspace = true
