<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manguebyte web demo</title>
    <style>
      :root {
        --bg: #f6f5f1;
        --fg: #1c1d1f;
        --muted: #63666b;
        --line: #d6d4cc;
        --accent: #0d7a5f;
        --step: #e7e5de;
        --hit: #1c1d1f;
        --now: #0d7a5f;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141517;
          --fg: #e9e8e4;
          --muted: #9a9ca1;
          --line: #34363a;
          --accent: #4cc39f;
          --step: #26282c;
          --hit: #e9e8e4;
          --now: #4cc39f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 16px 48px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin: 20px 0;
      }
      button {
        font: inherit;
        padding: 8px 18px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        font-size: 13px;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: 64px repeat(16, 1fr);
        gap: 3px;
        margin: 16px 0 24px;
        font-size: 12px;
        align-items: center;
      }
      .grid .label {
        color: var(--muted);
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      .cell {
        height: 22px;
        border-radius: 3px;
        background: var(--step);
        text-align: center;
        line-height: 22px;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 11px;
        color: var(--bg);
      }
      .cell.on {
        background: var(--hit);
      }
      .cell.now {
        outline: 2px solid var(--now);
        outline-offset: 1px;
      }
      .sliders {
        display: grid;
        grid-template-columns: max-content 1fr 7em;
        gap: 8px 12px;
        align-items: center;
      }
      .sliders output {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        text-align: right;
      }
      input[type='range'] {
        width: 100%;
        accent-color: var(--accent);
      }
      @media (max-width: 520px) {
        .grid {
          grid-template-columns: 40px repeat(16, 1fr);
          gap: 2px;
        }
        .cell {
          font-size: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Manguebyte in an AudioWorklet</h1>
      <p>
        A one-bar drum pattern and a bass line, scheduled as 32-byte event records and rendered by the
        manguebyte-web engine compiled to WebAssembly.
      </p>
      <div class="controls">
        <button id="start" class="primary">Play</button>
        <button id="stop" disabled>Stop</button>
        <span id="status">Not started.</span>
      </div>
      <div class="grid" id="grid" aria-label="Pattern"></div>
      <div class="sliders" id="sliders"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
