[package]
name = "manguebyte-web"
description = "A Manguebyte engine for the browser: parts with a synth, drum kits, an SFZ sampler or the instruments of manguebyte-dsp through a chain of effects, a master bus with a true-peak limiter, sample-exact 32-byte event records, a shared-memory event ring, WebAssembly exports and an AudioWorklet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# `cdylib` is what `cargo build --target wasm32-unknown-unknown` turns into
# a `.wasm` module; `rlib` is what native code and the tests link against.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The BS.1770 loudness meter a sampler part measures an instrument with
# when it loads, to play it at the loudness target; the tests read the
# other kinds' loudness and the master bus's true peak with it too. It is
# in the workspace and adds nothing outside it.
manguebyte-analysis.workspace = true
manguebyte-core.workspace = true
manguebyte-dsp.workspace = true
# The modulation wheel a polyphonic synthesiser part sends its voices.
manguebyte-midi.workspace = true
manguebyte-params.workspace = true
manguebyte-sampler.workspace = true

[dev-dependencies]
# WAV files for the tests that load sampler parts.
manguebyte-formats.workspace = true

[[example]]
# Patches of the polyphonic synthesiser beyond its presets (sixteen unison
# voices), built for `examples/voice_cost.mjs` to time in WebAssembly.
name = "unison_cost"
crate-type = ["cdylib"]

[lints]
workspace = true
