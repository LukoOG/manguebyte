[package]
name = "manguebyte-gui"
description = "The glue between Manguebyte's plugin wrappers and its user interface: an editor spec that opens a widget tree in a child window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Geometry and pixmaps: what the interface draws and the window presents.
manguebyte-gfx.workspace = true
# The parameters an application window's gestures set, as a standalone
# program's host would.
manguebyte-params.workspace = true
# The editor contract this crate implements (`manguebyte_plugin::editor`).
manguebyte-plugin.workspace = true
# The widget tree, its frames and its input.
manguebyte-ui.workspace = true
# The child window inside the host's window, and the headless backend.
manguebyte-window.workspace = true
# Only with the `standalone` feature: the glue between a running
# standalone plugin and the audio settings view (`audio_settings`). They
# bring the system's audio and MIDI libraries, which an editor inside a
# host never needs, so they are left out by default (ADR 0022).
manguebyte-devices = { workspace = true, optional = true }
manguebyte-standalone = { workspace = true, optional = true }

[features]
# Adds `audio_settings`: fills `manguebyte_ui::audio_settings`' model in
# from a running `manguebyte_standalone::Standalone` and carries out its
# requests. Only adds API.
standalone = ["dep:manguebyte-devices", "dep:manguebyte-standalone"]
# Adds `Editor::on_headless_open` and `HeadlessEditor`: an editor given a
# hook opens in the headless window backend whatever the parent is, so
# that tests can drive it through a real plugin wrapper on every system.
# Only adds API: editors without a hook are unchanged.
headless = []

[dev-dependencies]
# The crate's own tests use the headless mode.
# A path, not the workspace entry: cargo drops path-only dev-dependencies
# when it publishes, and a crate cannot depend on itself from crates.io.
manguebyte-gui = { path = ".", features = ["headless", "standalone"] }
# The headless device backend the audio settings glue is tested on.
manguebyte-devices.workspace = true
manguebyte-standalone.workspace = true
# Real windows for the Win32 tests of the glue.
manguebyte-window = { workspace = true, features = ["testing"] }
# The test plugins and the wrappers they are driven through.
manguebyte-clap.workspace = true
manguebyte-core.workspace = true
manguebyte-dsp.workspace = true
manguebyte-vst3.workspace = true

[lints]
workspace = true
