[package]
name = "manguebyte"
description = "The Manguebyte Audio Framework. Modern, real-time-safe audio for Rust: buffers, DSP, MIDI, audio files and device I/O in one place."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[features]
default = ["devices", "analysis", "osc"]
## Audio device I/O. Pulls in the platform audio backend.
devices = ["dep:manguebyte-devices"]
## Building CLAP plugins.
clap = ["dep:manguebyte-clap"]
## Building VST 3 plugins.
vst3 = ["dep:manguebyte-vst3"]
## Building LV2 plugins.
lv2 = ["dep:manguebyte-lv2"]
## Building Audio Units (version 2) for macOS. The wrapper builds on every
## system; only on macOS does it export a unit a host can load.
au = ["dep:manguebyte-au"]
## Plugin editors: the widgets and the glue that opens them in a host's
## window.
gui = ["dep:manguebyte-gui", "dep:manguebyte-ui"]
## An SFZ sampler.
sampler = ["dep:manguebyte-sampler"]
## Metering and analysis: loudness, true peak, level meters, spectrum, pitch.
analysis = ["dep:manguebyte-analysis"]
## Open Sound Control.
osc = ["dep:manguebyte-osc"]
## Loading CLAP, VST 3 and LV2 plugins made by anyone and running them,
## and finding the ones installed on a system.
host = ["dep:manguebyte-host"]
## Running a plugin as a standalone application.
standalone = ["dep:manguebyte-standalone", "devices"]
## Decoding AAC, ALAC and WMA through the system's codecs: Media
## Foundation on Windows, AudioToolbox on macOS.
platform-codecs = ["manguebyte-formats/platform-codecs"]

[dependencies]
manguebyte-core.workspace = true
manguebyte-params.workspace = true
manguebyte-plugin.workspace = true
manguebyte-midi.workspace = true
manguebyte-dsp.workspace = true
manguebyte-formats.workspace = true
manguebyte-graph.workspace = true
manguebyte-devices = { workspace = true, optional = true }
manguebyte-clap = { workspace = true, optional = true }
manguebyte-vst3 = { workspace = true, optional = true }
manguebyte-lv2 = { workspace = true, optional = true }
manguebyte-au = { workspace = true, optional = true }
manguebyte-gui = { workspace = true, optional = true }
manguebyte-ui = { workspace = true, optional = true }
manguebyte-sampler = { workspace = true, optional = true }
manguebyte-analysis = { workspace = true, optional = true }
manguebyte-osc = { workspace = true, optional = true }
manguebyte-host = { workspace = true, optional = true }
manguebyte-standalone = { workspace = true, optional = true }

[[example]]
name = "play_riff"
required-features = ["devices"]

[[example]]
name = "list_devices"
required-features = ["devices"]

[[example]]
name = "input_meter"
required-features = ["devices"]

[lints]
workspace = true

# docs.rs documents every module, not only those of the default features.
[package.metadata.docs.rs]
all-features = true
