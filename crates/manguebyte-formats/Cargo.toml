[package]
name = "manguebyte-formats"
description = "Audio files for the Manguebyte Audio Framework: WAV, RF64, AIFF and FLAC reading and writing, Ogg Vorbis and MP3 reading, file playback and recording."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
manguebyte-core.workspace = true

# Media Foundation, for `platform-codecs` on Windows. 0.61.2 declares Rust
# 1.71 and is already in Cargo.lock (the window crate uses it). Media
# Foundation itself is COM, which windows-sys does not declare; its
# functions and interfaces are declared in `src/platform/windows.rs`. Only
# two modules are compiled: `Win32_System_Com` to initialise COM on the
# threads that decode, and `Win32_UI_Shell` for `SHCreateMemStream`, which
# lets Media Foundation read a file held in memory.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", optional = true, features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[features]
# Decoding through the system's codecs: Media Foundation on Windows (AAC,
# ALAC, WMA and what else the system has), AudioToolbox on macOS (AAC,
# ALAC, CAF). Off by default: it calls into the system with unsafe code,
# and what it decodes depends on the system. Linux has no such layer, and
# with this on, those formats are refused there as they are without it.
platform-codecs = ["dep:windows-sys"]

[lints]
workspace = true
