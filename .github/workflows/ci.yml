name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace

  features:
    name: Without default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No audio backend and no system libraries: this is what an embedded
      # or headless user builds.
      - run: cargo test -p manguebyte --no-default-features

  miri:
    name: Miri (unsafe code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # The framework has unsafe code in two places: the wait-free queue and
      # the CLAP wrapper, which talks to hosts through C. Miri runs their
      # tests under an interpreter that detects undefined behaviour and data
      # races. The CLAP tests drive the wrapper through its C interface, so
      # every pointer it handles is checked.
      - run: cargo miri test -p manguebyte-core
        env:
          RUSTFLAGS: ""
      - run: cargo miri test -p manguebyte-clap
        env:
          RUSTFLAGS: ""

  clap:
    name: CLAP validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # clap-validator is the CLAP project's own conformance tool. It loads
      # the example plugin the way a host does and checks its descriptor,
      # ports, parameters, state and processing, with fuzzing.
      - name: Get clap-validator
        run: |
          git clone https://github.com/free-audio/clap-validator "$RUNNER_TEMP/clap-validator"
          git -C "$RUNNER_TEMP/clap-validator" checkout b2f1d9b79b1d264a5747f46707d72b1aa40a02ef
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clap-validator/target
          key: clap-validator-b2f1d9b-${{ runner.os }}
      - name: Build clap-validator
        run: cargo build --release --manifest-path "$RUNNER_TEMP/clap-validator/Cargo.toml"
        env:
          RUSTFLAGS: ""
      - run: ./scripts/bundle-clap.sh mangue-pluck "Mangue Pluck"
      - name: Validate
        run: |
          "$RUNNER_TEMP/clap-validator/target/release/clap-validator" validate \
            "target/bundled/Mangue Pluck.clap" | tee validation.txt
          # The tool reports failures in its summary; make them fail the job.
          grep -Eq "tests run, [0-9]+ passed, 0 failed" <(sed 's/\x1b\[[0-9;]*m//g' validation.txt)

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace --all-targets
