name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo doc --workspace --no-deps

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace

  features:
    name: Without default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # No audio backend and no system libraries: this is what an embedded
      # or headless user builds.
      - run: cargo test -p manguebyte --no-default-features

  miri:
    name: Miri (unsafe code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # The framework's unsafe code that handles memory is in the wait-free
      # queue, the triple buffer of the analysis crate, the CLAP and VST 3
      # wrappers, which talk to hosts through C and COM, and the plugin
      # host, which talks to plugins the same way. Miri runs their tests
      # under an interpreter that detects undefined behaviour and data
      # races. The wrapper tests drive each plugin through its binary
      # interface, so every pointer it handles is checked.
      - run: cargo miri test -p manguebyte-core
        env:
          RUSTFLAGS: ""
      - run: cargo miri test -p manguebyte-clap
        env:
          RUSTFLAGS: ""
      - run: cargo miri test -p manguebyte-vst3
        env:
          RUSTFLAGS: ""
      - run: cargo miri test -p manguebyte-analysis --lib triple_buffer --test triple_buffer
        env:
          RUSTFLAGS: ""

  miri-host:
    name: Miri (plugin host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # The host's tests that use plugins compiled into the test itself (no
      # shared library is loaded, which Miri cannot do). Some of them leak a
      # plugin on purpose, to show what happens when one is left loaded, and
      # some check that a path with nothing at it is an error, which needs
      # the file system.
      - run: cargo miri test -p manguebyte-host --lib --test clap_hostile --test clap_edges --test vst3_hostile
        env:
          RUSTFLAGS: ""
          MIRIFLAGS: -Zmiri-ignore-leaks -Zmiri-disable-isolation

  clap:
    name: CLAP validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # clap-validator is the CLAP project's own conformance tool. It loads
      # the example plugin the way a host does and checks its descriptor,
      # ports, parameters, state and processing, with fuzzing.
      - name: Get clap-validator
        run: |
          git clone https://github.com/free-audio/clap-validator "$RUNNER_TEMP/clap-validator"
          git -C "$RUNNER_TEMP/clap-validator" checkout b2f1d9b79b1d264a5747f46707d72b1aa40a02ef
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clap-validator/target
          key: clap-validator-b2f1d9b-${{ runner.os }}
      - name: Build clap-validator
        run: cargo build --release --manifest-path "$RUNNER_TEMP/clap-validator/Cargo.toml"
        env:
          RUSTFLAGS: ""
      # An instrument and an effect with a sidechain, so that both kinds of
      # plugin go through the validator.
      - run: ./scripts/bundle-clap.sh mangue-pluck "Mangue Pluck"
      - run: ./scripts/bundle-clap.sh mangue-duck "Mangue Duck"
      - name: Validate
        run: |
          for plugin in "Mangue Pluck" "Mangue Duck"; do
            "$RUNNER_TEMP/clap-validator/target/release/clap-validator" validate \
              "target/bundled/$plugin.clap" | tee validation.txt
            # The tool reports failures in its summary; make them fail the job.
            grep -Eq "tests run, [0-9]+ passed, 0 failed" <(sed 's/\x1b\[[0-9;]*m//g' validation.txt)
          done

  vst3:
    name: VST 3 validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # VST 3 SDK 3.8.1.
      VST3_SDK: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The validator is Steinberg's own conformance tool, from the VST 3
      # SDK. It loads the example plugin's bundle the way a host does and
      # checks its classes, buses, parameters, units, state, MIDI mapping,
      # note expressions and processing, at many block sizes and sample
      # rates.
      - uses: actions/cache@v4
        id: validator
        with:
          path: ${{ runner.temp }}/vst3-validator
          key: vst3-validator-3cdf9ca-${{ runner.os }}-${{ runner.arch }}
      - name: Build the validator
        if: steps.validator.outputs.cache-hit != 'true'
        run: |
          sdk="$RUNNER_TEMP/vst3sdk"
          git init -q "$sdk"
          git -C "$sdk" remote add origin https://github.com/steinbergmedia/vst3sdk.git
          git -C "$sdk" fetch -q --depth 1 origin "$VST3_SDK"
          git -C "$sdk" checkout -q FETCH_HEAD
          git -C "$sdk" submodule update -q --init --depth 1 base cmake pluginterfaces public.sdk
          # The other hosting examples need a windowing toolkit and a sound
          # server. Only the validator is wanted, and it borrows some of
          # their sources, so they are left out of the build but not removed.
          rm "$sdk/public.sdk/samples/vst-hosting/editorhost/CMakeLists.txt" \
             "$sdk/public.sdk/samples/vst-hosting/audiohost/CMakeLists.txt"
          cmake -S "$sdk" -B "$sdk/build" -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF \
            -DSMTG_CREATE_PLUGIN_LINK=OFF -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build "$sdk/build" --config Release --target validator --parallel 4
          mkdir -p "$RUNNER_TEMP/vst3-validator"
          find "$sdk/build" -type f \( -name validator -o -name validator.exe \) \
            -exec cp {} "$RUNNER_TEMP/vst3-validator/" \;
          ls -l "$RUNNER_TEMP/vst3-validator"
      # An instrument and an effect with a sidechain, so that both kinds of
      # plugin go through the validator.
      - run: ./scripts/bundle-vst3.sh mangue-pluck "Mangue Pluck"
      - run: ./scripts/bundle-vst3.sh mangue-duck "Mangue Duck"
      - name: Validate
        run: |
          validator="$(find "$RUNNER_TEMP/vst3-validator" -type f -name 'validator*' | head -n 1)"
          for plugin in "Mangue Pluck" "Mangue Duck"; do
            "$validator" -e "target/bundled/$plugin.vst3" > validation.txt || true
            # The full log lists two thousand hidden controller parameters.
            grep -v "Parameter [0-9]* (id=" validation.txt | grep -v "^\[Succeeded\]$" | grep -v "^$" | tail -n 60
            grep -Eq "Result: [1-9][0-9]* tests passed, 0 tests failed" validation.txt
          done

  cli:
    name: Command-line tool end to end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # Generates a plugin of each kind against this checkout, builds it and
      # bundles it, which on macOS includes the ad-hoc signature.
      - run: cargo test -p cargo-mangue -- --ignored

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace --all-targets
